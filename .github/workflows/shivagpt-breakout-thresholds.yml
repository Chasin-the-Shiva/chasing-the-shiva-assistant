name: ShivaGPT Breakout Threshold Comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/compare-breakout-thresholds.mjs"
      - ".github/workflows/shivagpt-breakout-thresholds.yml"
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare next-week role persistence thresholds
        run: |
          node --check scripts/compare-breakout-thresholds.mjs
          node scripts/compare-breakout-thresholds.mjs
      - name: Publish research-only backtest
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-breakout-threshold-comparison.json
          git diff --cached --quiet && exit 0
          git commit -m "Record historical breakout threshold sensitivity"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
