name: ShivaGPT Weekly Acquisition Decision
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-weekly-acquisition-decision.mjs"
      - ".github/workflows/shivagpt-weekly-acquisition-decision.yml"
  schedule:
    - cron: "34 7 * * 2"
      timezone: "America/New_York"
permissions:
  contents: write
concurrency:
  group: shivagpt-weekly-acquisition-decision
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build transparent acquisition decisions
        run: |
          node --check scripts/build-weekly-acquisition-decision.mjs
          node scripts/build-weekly-acquisition-decision.mjs
      - name: Publish read-only decision output
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-weekly-acquisition-decision.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish ShivaGPT acquisition decision review"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
