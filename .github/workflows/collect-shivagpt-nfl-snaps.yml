name: Collect ShivaGPT NFL Offensive Snaps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect-nfl-snaps.py"
      - ".github/workflows/collect-shivagpt-nfl-snaps.yml"
  schedule:
    - cron: "11 6 * * *"
      timezone: "America/New_York"
permissions:
  contents: write
concurrency:
  group: shivagpt-nfl-snaps
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate Yahoo-matched NFL snap shares
        run: python scripts/collect-nfl-snaps.py
      - name: Publish verified snap share data
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/shivagpt-nfl-snaps.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated NFL snap shares"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Safe publishing failed after four attempts" >&2
          exit 1
