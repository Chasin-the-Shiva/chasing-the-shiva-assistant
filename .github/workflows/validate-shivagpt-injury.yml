name: ShivaGPT Injury & Return Radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-injury-radar.mjs"
      - ".github/workflows/validate-shivagpt-injury.yml"
  schedule:
    - cron: "30 * * * *"
permissions:
  contents: write
concurrency:
  group: shivagpt-injury-radar
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize with latest main before injury validation
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate designation-change radar
        run: node scripts/build-injury-radar.mjs
      - name: Display safe coverage only
        run: |
          node -e 'const d=require("./reports/shivagpt-injury-radar.json");console.log(JSON.stringify({players:d.player_count,injured:d.injured_player_count,changes:d.changes.length,baseline:d.baseline_available,limitations:d.limitations.length}))'
      - name: Publish validated injury baseline and radar
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/shivagpt-injury-state.json reports/shivagpt-injury-radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated ShivaGPT injury radar"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Safe publishing failed after four attempts" >&2
          exit 1
