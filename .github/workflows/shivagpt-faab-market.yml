name: ShivaGPT FAAB Market Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-faab-market.mjs"
      - ".github/workflows/shivagpt-faab-market.yml"
  schedule:
    - cron: "40 6 * * 2"
      timezone: "America/New_York"
permissions:
  contents: write
concurrency:
  group: shivagpt-faab-market
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Calculate anonymized successful Yahoo waiver bids
        run: node scripts/build-faab-market.mjs
      - name: Publish sanitized FAAB market benchmarks
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-faab-market.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified ShivaGPT FAAB price history"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Safe publishing failed after four attempts" >&2
          exit 1
