name: Test ShivaGPT Waiver Decision Queue
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate read-only Joe roster and ADD DROP research comparisons
        run: node scripts/build-waiver-decision-queue.mjs
