name: Refresh sanitized Yahoo snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-yahoo-snapshot.yml"
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-yahoo-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh current 2026 league data
        run: |
          mkdir -p public
          curl --fail --silent --show-error --retry 3 \
            "https://shivagpt-yahoo-api.redmoosejoe.chatgpt.site/season-manager-feed" \
            --output /tmp/shivagpt-source.json
          node -e 'const fs=require("fs"),src=JSON.parse(fs.readFileSync("/tmp/shivagpt-source.json","utf8")),deny=/(url|uri|guid|email|account|login|manager|nickname|token|secret|client|(^|_)key$|avatar|logo|commissioner|sendbird|renew|^user_)/i;function clean(v){if(Array.isArray(v))return v.map(clean);if(!v||typeof v!=="object")return v;return Object.fromEntries(Object.entries(v).filter(([k])=>!deny.test(k)).map(([k,x])=>[k,clean(x)]));}if(src.schema!=="shivagpt-season-manager-v1"||src.read_only!==true)process.exit(1);const data=clean(src),available={schema:data.schema,read_only:data.read_only,retrieved_at:data.retrieved_at,league_id:data.league_id,league_name:data.league_name,team_name:data.team_name,available_players:data.available_players};delete data.available_players;fs.writeFileSync("public/shivagpt-live.json",JSON.stringify(data));fs.writeFileSync("public/shivagpt-available.json",JSON.stringify(available))'
          node scripts/build-scoring-reference.mjs \
            public/shivagpt-live.json \
            public/shivagpt-scoring.json
      - name: Build locked deterministic manager history
        if: github.event_name != 'schedule'
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://shivagpt-yahoo-api.redmoosejoe.chatgpt.site/season-manager-history" \
            --output /tmp/shivagpt-manager-history-source.json
          node scripts/build-manager-history-v3.mjs \
            /tmp/shivagpt-manager-history-source.json \
            public/shivagpt-manager-history.json
          node -e 'const fs=require("fs"),d=JSON.parse(fs.readFileSync("public/shivagpt-manager-history.json","utf8")),ids=["manager_miles","manager_mik","manager_trevor","manager_dom","manager_joe","manager_dan","manager_john","manager_jason","manager_james","manager_dwayne","manager_perry","manager_ryan_gorsh"];if(d.schema!=="shivagpt-manager-history-v3"||d.read_only!==true||d.manager_profiles.length!==ids.length)process.exit(1);for(const id of ids){const p=d.manager_profiles.find(x=>x.manager_id===id);if(!p||!p.seasons["2025"]||!p.seasons["2026"]||d.manager_lookup.by_name[p.manager_name.toLowerCase()]!==id||d.manager_lookup.by_manager_ref[p.manager_ref]!==id)process.exit(1)}'
      - name: Publish changed snapshots
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/shivagpt-live.json public/shivagpt-available.json public/shivagpt-scoring.json public/shivagpt-manager-history.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh sanitized Yahoo snapshots"
          git push

# Scheduled runs refresh only current-season data. Manager history v3 is rebuilt only by an explicit manual run or workflow configuration change.
