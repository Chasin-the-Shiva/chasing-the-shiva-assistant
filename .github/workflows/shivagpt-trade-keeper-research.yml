name: ShivaGPT Twelve-Team Trade Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-trade-keeper-research.mjs"
      - ".github/workflows/shivagpt-trade-keeper-research.yml"
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Identify candidate surplus players on all twelve teams
        run: |
          node --check scripts/build-trade-keeper-research.mjs
          node scripts/build-trade-keeper-research.mjs
      - name: Publish verified league trade research
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-trade-keeper-research.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish twelve-team trade research"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
