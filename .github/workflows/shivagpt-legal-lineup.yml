name: ShivaGPT Legal Lineup Alternatives
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-legal-lineup-options.mjs"
      - ".github/workflows/shivagpt-legal-lineup.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate legal internal substitutions
        run: |
          node --check scripts/build-legal-lineup-options.mjs
          node scripts/build-legal-lineup-options.mjs
      - name: Publish no-action lineup alternatives
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-legal-lineup-options.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish legal lineup substitution research"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
