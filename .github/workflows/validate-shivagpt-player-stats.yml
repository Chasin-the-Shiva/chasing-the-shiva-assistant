name: Validate ShivaGPT player statistics collector
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 2"
      timezone: "America/New_York"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-shivagpt-player-stats.yml"

permissions:
  contents: write

concurrency:
  group: shivagpt-player-stats-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect and validate entire Yahoo player pool
        run: node scripts/collect-player-stats.mjs
      - name: Show coverage without disclosing player data
        run: |
          node -e 'const d=require("./public/shivagpt-player-stats.json"); console.log(JSON.stringify({schema:d.schema,completed_through_week:d.completed_through_week,collection:d.collection},null,2))'
      - name: Publish validated player statistics only
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/shivagpt-player-stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated ShivaGPT player statistics"
          git pull --rebase origin main
          git push origin HEAD:main
