name: ShivaGPT Yahoo Popularity Radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shivagpt-popularity-collect.yml"
  schedule:
    - cron: "45 * * * *"
permissions:
  contents: write
concurrency:
  group: shivagpt-popularity-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize with latest main before collecting
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserve previous validated snapshot for comparison
        run: |
          if test -f public/shivagpt-popularity-source.json; then cp public/shivagpt-popularity-source.json /tmp/shivagpt-popularity-previous.json; fi
      - name: Collect full popularity pool with safe retries
        run: node scripts/collect-popularity.mjs
      - name: Generate research triggers
        run: node scripts/build-popularity-radar.mjs
      - name: Publish only after both steps pass
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/shivagpt-popularity-source.json reports/shivagpt-popularity-radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated Yahoo ownership radar"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Safe publishing failed after four attempts" >&2
          exit 1
