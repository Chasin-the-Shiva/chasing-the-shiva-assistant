name: ShivaGPT Yahoo Popularity Radar
on:
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"
permissions:
  contents: write
concurrency:
  group: shivagpt-popularity-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect full popularity pool with safe retries
        run: node scripts/collect-popularity.mjs
      - name: Generate research triggers
        run: node scripts/build-popularity-radar.mjs
      - name: Publish only after both steps pass
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/shivagpt-popularity-source.json reports/shivagpt-popularity-radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated Yahoo ownership radar"
          git pull --rebase origin main
          git push origin HEAD:main
