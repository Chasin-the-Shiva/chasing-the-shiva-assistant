name: ShivaGPT Wednesday Free Agent Contingencies
on:
  workflow_dispatch:
  # Permit a scoped, read-only recovery when GitHub skips the Wednesday schedule.
  # Changing this workflow file triggers its report builder on current main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/shivagpt-wednesday-fa.yml"
  schedule:
    - cron: "30 7 * * 3"
      timezone: "America/New_York"
permissions:
  contents: write
concurrency:
  group: shivagpt-wednesday-fa
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current FA status and build candidate queue
        run: node scripts/build-wednesday-fa.mjs
      - name: Publish only validated queue
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-wednesday-fa.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Wednesday FA research queue"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Safe publishing failed after four attempts" >&2
          exit 1
# Read-only Wednesday FA publication recovery trigger 2026-11-04 07:49 EST; no workflow commands, permissions, or Yahoo data writes changed.
# Read-only Wednesday 2026-11-11 missed-schedule report recovery trigger at 08:43 EST: the 07:30 America/New_York scheduled run did not start, and the published Wednesday FA report remained dated 2026-11-04. Comment-only push to rerun existing validated report builder; no commands, cron, permissions, Yahoo writes, lineups, bids or alert settings changed.
