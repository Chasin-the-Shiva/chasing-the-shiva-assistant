name: ShivaGPT Prospective Breakout Tracking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shivagpt-prospective-breakout.yml"
  schedule:
    - cron: "49 7 * * 2"
      timezone: "America/New_York"
permissions:
  contents: write
concurrency:
  group: shivagpt-prospective-breakout
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserve this week's predictions without overwriting old forecasts
        run: |
          node --check scripts/log-prospective-signals.mjs
          node scripts/log-prospective-signals.mjs
      - name: Publish immutable prospective evidence
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/prospective/
          git diff --cached --quiet && exit 0
          git commit -m "Record immutable breakout forecasts before next games"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
