name: ShivaGPT Draft Round Actual Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze-draft-round-production.mjs"
      - ".github/workflows/shivagpt-draft-round-production.yml"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/analyze-draft-round-production.mjs
