name: Prepare ShivaGPT Tuesday Waiver Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 2"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: shivagpt-tuesday-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh monitoring priorities from latest validated data
        run: node scripts/build-monitoring-400.mjs
      - name: Build full read-only waiver and executive decision chain
        run: |
          node scripts/build-waiver-decision-queue.mjs
          node scripts/build-acquisition-gates.mjs
          node scripts/build-replacement-choices.mjs
          node scripts/build-weekly-acquisition-decision.mjs
          node scripts/build-weekly-executive-decisions.mjs
      - name: Verify lineup safety using the same checked roster
        run: |
          node scripts/build-lineup-safety.mjs
          node scripts/build-legal-lineup-options.mjs
          node scripts/build-weekly-lineup-action-review.mjs
      - name: Check prerequisites and generate factual waiver brief
        run: node scripts/build-tuesday-brief.mjs
      - name: Publish only validated generated brief
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-tuesday-latest.md reports/shivagpt-monitoring-400.json reports/shivagpt-waiver-decision-queue.json reports/shivagpt-acquisition-gates.json reports/shivagpt-replacement-choices.json reports/shivagpt-weekly-acquisition-decision.json reports/shivagpt-weekly-executive-decisions.json reports/shivagpt-lineup-safety.json reports/shivagpt-legal-lineup-options.json reports/shivagpt-weekly-lineup-action-review.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Tuesday ShivaGPT scouting brief"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Safe publishing failed after four attempts" >&2
          exit 1
