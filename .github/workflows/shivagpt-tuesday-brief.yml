name: Prepare ShivaGPT Tuesday Waiver Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 2"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: shivagpt-tuesday-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh monitoring priorities from latest validated data
        run: node scripts/build-monitoring-400.mjs
      - name: Build read-only ADD DROP research comparisons
        run: node scripts/build-waiver-decision-queue.mjs
      - name: Check prerequisites and generate factual waiver brief
        run: node scripts/build-tuesday-brief.mjs
      - name: Publish only validated generated brief
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-tuesday-latest.md reports/shivagpt-monitoring-400.json reports/shivagpt-waiver-decision-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Tuesday ShivaGPT scouting brief"
          git pull --rebase origin main
          git push origin HEAD:main
