name: Validate ShivaGPT monitoring pool
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify monitoring pool
        run: node scripts/build-monitoring-400.mjs
