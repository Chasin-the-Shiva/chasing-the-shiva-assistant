name: ShivaGPT 400-Player Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"
permissions:
  contents: write
concurrency:
  group: shivagpt-monitoring-400
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify monitoring pool
        run: node scripts/build-monitoring-400.mjs
      - name: Publish complete monitoring pool
        run: |
          git config user.name "ShivaGPT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shivagpt-monitoring-400.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh ShivaGPT 400-player monitoring pool"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Safe publishing failed after four attempts" >&2
          exit 1
